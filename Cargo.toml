[package]
name = "e3d-io"
version = "0.5.0"
edition = "2021"
description = "Standalone IO library for AVEVA E3D 2.1 / 3.1 database files: read every session, write a new one the way core.dll does"

[dependencies]
thiserror = "2"
nom = "8"
e3d-attlib = { path = "../e3d-attlib" }
serde_json = "1"
sha2 = "0.10"
encoding_rs = "0.8.35"

[dev-dependencies]
tempfile = "3"
proptest = "=1.11.0"
