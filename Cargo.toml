[package]
name = "e3d-io"
version = "0.1.0"
edition = "2021"
description = "Standalone read-only IO library for version-detected AVEVA E3D database files"

[dependencies]
thiserror = "2"
nom = "8"
e3d-attlib = { path = "../e3d-attlib" }
serde_json = "1"
sha2 = "0.10"
encoding_rs = "0.8.35"

[dev-dependencies]
tempfile = "3"
